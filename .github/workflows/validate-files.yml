name: Validate files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate file formats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Validate Markdown, JSON, and YAML formatting
        run: npx --yes prettier@3 --check "**/*.{md,json,yml,yaml}"

      - name: Validate GitHub Actions workflows
        uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1
