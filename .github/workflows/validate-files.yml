name: Validate files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate file formats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate Markdown, JSON, and YAML formatting
        run: npx --yes prettier@3 --check "**/*.{md,json,yml,yaml}"

      - name: Validate GitHub Actions workflows
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1
